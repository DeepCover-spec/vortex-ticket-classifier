name: CI

# Runs on every pull request to main (and on pushes to main).
# 1. test:   install pinned deps on Python 3.11, check no key is committed, run the contract tests in-process
# 2. docker: build the image, start the container, run the SAME tests against it over HTTP
# Both jobs skip the parts that need files that don't exist yet (app/main.py, Dockerfile),
# so early pull requests (EDA, training, docs) are not blocked.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_API_KEY: ci-test-key   # throwaway key for tests only; never the real evaluation key

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Make sure no API key was committed
        run: |
          if git grep -nIE "tf2_[0-9a-f]{16,}" -- . ':!.github'; then
            echo "::error::Something that looks like the real API key is in the repo. Remove it and rotate the key."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pinned requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generated models import cleanly
        run: python -c "import app.schemas; print('schemas ok')"

      - name: Contract and edge-case tests (in-process)
        if: ${{ hashFiles('app/main.py') != '' }}
        env:
          TF_API_KEY: ${{ env.CI_API_KEY }}
        run: pytest -q

      - name: Skipped tests (app/main.py not on this branch yet)
        if: ${{ hashFiles('app/main.py') == '' }}
        run: echo "::notice::app/main.py does not exist yet, so the API tests were skipped."

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check for a Dockerfile
        id: has_docker
        run: |
          if [ -f Dockerfile ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "::notice::No Dockerfile yet, skipping the container job."; echo "found=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.has_docker.outputs.found == 'true'
        with:
          python-version: "3.11"

      - name: Install test tools only
        if: steps.has_docker.outputs.found == 'true'
        run: pip install pytest==8.1.1 httpx==0.27.0 jsonschema==4.21.1

      - name: Build image
        if: steps.has_docker.outputs.found == 'true'
        run: docker build -t ticket-classifier:ci .

      - name: Start container with the single documented command
        if: steps.has_docker.outputs.found == 'true'
        run: docker run -d --name tc -p 8000:8000 -e API_KEY="$CI_API_KEY" ticket-classifier:ci

      - name: Wait for /health (spec allows up to 120 s)
        if: steps.has_docker.outputs.found == 'true'
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then echo; echo "healthy after ~$((i*2))s"; exit 0; fi
            sleep 2
          done
          echo "::error::/health did not return 200 within 120 s"
          docker logs tc || true
          exit 1

      - name: Contract and edge-case tests against the container
        if: steps.has_docker.outputs.found == 'true'
        env:
          TF_BASE_URL: http://localhost:8000
          TF_API_KEY: ${{ env.CI_API_KEY }}
          TF_JOB_TIMEOUT: "600"
        run: pytest -q

      - name: Container logs (on failure)
        if: failure() && steps.has_docker.outputs.found == 'true'
        run: docker logs tc || true

      - name: Cleanup
        if: always() && steps.has_docker.outputs.found == 'true'
        run: docker rm -f tc || true
